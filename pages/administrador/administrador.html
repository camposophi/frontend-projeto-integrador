<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../style.css">
    <script src="../../app.js" defer></script>

    <title>Administrador - AgroBio</title>
</head>
<body>
    <header>
        <nav>
            <span class="logo">AgroBio</span>
            <ul>
                <li><a href="../../index.html">Início</a></li>
                <li><a href="../consulta/consulta.html">Carrinho</a></li>
                <li><a href="../cliente/cliente.html">Cadastro Cliente</a></li>
                <li><a href="./administrador.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main class="conteudo">
        <h2>Painel do Administrador</h2>
        <p>Cadastre novos produtos ou edite os itens existentes no catálogo.</p>

        <!-- Formulário de Cadastro / Edição -->
        <form id="form-admin-produto" class="form-agrobio">
            <h3 id="titulo-form-admin" style="color: #1b4332; margin-bottom: 1rem;">Cadastrar Novo Produto</h3>
            <input type="hidden" id="admin-id-produto">

            <div class="campo">
                <label for="admin-nome">Nome do Produto</label>
                <input type="text" id="admin-nome" required placeholder="Ex: Semente de Milho BT">
            </div>

            <div class="campo-duplo">
                <div class="campo">
                    <label for="admin-categoria">Categoria</label>
                    <select id="admin-categoria" required class="select-admin">
                        <option value="1">Sementes Modificadas</option>
                        <option value="2">Insumos Biologicos</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="admin-preco">Preço (R$)</label>
                    <input type="number" id="admin-preco" step="0.01" min="0" required placeholder="Ex: 450.00">
                </div>
            </div>

            <div class="campo">
                <label for="admin-descricao">Descrição</label>
                <input type="text" id="admin-descricao" required placeholder="Ex: Resistente a pragas e seca">
            </div>

            <div class="campo">
                <label for="admin-imagem">Nome do Arquivo da Imagem (dentro da pasta img/)</label>
                <input type="text" id="admin-imagem" placeholder="Ex: milho.jpg">
            </div>

            <div style="display: flex; gap: 0.8rem;">
                <button type="submit" id="btn-salvar-admin" class="btn-principal">Cadastrar Produto</button>
                <button type="button" id="btn-cancelar-edicao" class="btn-secundario" hidden>Cancelar Edição</button>
            </div>

            <p id="msg-admin-sucesso" class="msg-sucesso" hidden></p>
        </form>

        <!-- Tabela de Produtos Cadastrados -->
        <section class="tabela-admin-container">
            <h3>Produtos Cadastrados</h3>
            <table class="tabela-admin">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Produto</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-produtos-admin"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AgroBio - Tecnologia em Sementes e Bioinsumos</p>
    </footer>
</body>
</html>
